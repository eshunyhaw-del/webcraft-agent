name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository consistency checks and unit tests
        run: node scripts/check.mjs
      - name: Python tools compile
        run: python3 -B -m py_compile scripts/media/webcraft_media.py
